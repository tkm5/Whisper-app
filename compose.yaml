services:
  nim-whisper:
    image: nvcr.io/nim/nvidia/whisper-large-v3:latest
    shm_size: 8gb
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
      - NIM_TAGS_SELECTOR=name=whisper-large-v3
    ports:
      - "9000:9000"
      - "50051:50051"
    volumes:
      - /mnt/ino-raid4/takumig/nim-cache:/opt/nim/.cache
      - /mnt/ino-raid4/takumig/nim-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  whisper-web:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./audio_files:/app/audio_files
      - ./output:/app/output
      - ./src/templates:/app/src/templates
      - ./src/transcriber.py:/app/src/transcriber.py
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-large}
      - WHISPER_LANG=${WHISPER_LANG:-ja}
      - NIM_ENDPOINT=http://nim-whisper:9000
    command: ["uv", "run", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      nim-whisper:
        condition: service_healthy
        required: false

  whisper-cli:
    build:
      context: .
    volumes:
      - ./audio_files:/app/audio_files
      - ./output:/app/output
    environment:
      - AUDIO_FILE=${AUDIO_FILE:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-large}
      - WHISPER_LANG=${WHISPER_LANG:-ja}
      - NIM_ENDPOINT=http://nim-whisper:9000
    command: ["uv", "run", "python", "main.py"]
    depends_on:
      nim-whisper:
        condition: service_healthy
        required: false
    profiles:
      - cli
