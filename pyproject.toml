[project]
name = "whisper-app"
version = "1.0.0"
description = "Audio transcription app using NVIDIA NIM Whisper"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "openai-whisper>=20231117",
    "torch>=2.0.0",
    "pandas>=2.0.0",
    "discordwebhook>=1.0.0",
    "nvidia-riva-client>=2.14.0",
    "requests>=2.28.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
